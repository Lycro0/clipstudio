name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Leave empty for an automatic 1.0.<run number>.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"; release=true
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            v="${{ github.event.inputs.version }}"; release=true
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            v="0.0.0-pr.${GITHUB_RUN_NUMBER}"; release=false
          else
            # Every push to main (or a manual run without a version) publishes a release.
            v="1.0.${GITHUB_RUN_NUMBER}"; release=true
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Download FFmpeg (shared, with NVENC/AMF/QSV/x264)
        shell: pwsh
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          )
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile ffmpeg.zip; break } catch { Write-Host "Failed: $u" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath deps-tmp
          New-Item -ItemType Directory -Force deps | Out-Null
          Move-Item (Get-ChildItem deps-tmp -Directory | Select-Object -First 1).FullName deps/ffmpeg

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_DIR="${{ github.workspace }}/deps/ffmpeg"

      - name: Build
        run: cmake --build build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ClipStudio.exe dist/
          Copy-Item deps/ffmpeg/bin/*.dll dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime dist/ClipStudio.exe
          Copy-Item LICENSE dist/LICENSE.txt -ErrorAction SilentlyContinue

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/ClipStudio.iss
          Compress-Archive -Path dist/* -DestinationPath "out/ClipStudio-${{ steps.ver.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-${{ steps.ver.outputs.version }}
          path: out/*

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ClipStudio ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
